<h2>Reset your Ripple password</h2>
<p>Your code is:</p>
<p style="font-size:28px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
<p>Enter this code in Ripple to choose a new password. It expires in one hour.</p>
<p>Or <a href="{{ .SiteURL }}/app?token_hash={{ .TokenHash }}&type=recovery">open Ripple to reset your password</a>.</p>
<p>If you didn't ask to reset your password, you can ignore this email.</p>
